<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
            background: #0d1117;
        }

        /* Animated Background */
        .background {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: linear-gradient(135deg, #0d1117 0%, #1c2128 50%, #0d1117 100%);
            z: -1;
            animation: gradientShift 8s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .stars {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #58a6ff;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Main Container */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            text-align: center;
            color: #c9d1d9;
            z-index: 1;
            position: relative;
        }

        h1 {
            font-size: 3.5em;
            margin-bottom: 20px;
            color: #58a6ff;
            text-shadow: 0 0 10px rgba(88, 166, 255, 0.5);
            animation: fadeInDown 1s ease-out;
        }

        .subtitle {
            font-size: 1.2em;
            color: #8b949e;
            margin-bottom: 50px;
            animation: fadeInUp 1s ease-out 0.2s both;
        }

        /* Button Styles */
        .button-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            animation: fadeInUp 1s ease-out 0.4s both;
        }

        button {
            padding: 12px 30px;
            font-size: 1em;
            font-family: 'Courier New', monospace;
            border: 2px solid #58a6ff;
            background: transparent;
            color: #58a6ff;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: #58a6ff;
            z-index: -1;
            transition: left 0.3s ease;
        }

        button:hover {
            color: #0d1117;
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(88, 166, 255, 0.4);
        }

        button:hover::before {
            left: 0;
        }

        button:active {
            transform: translateY(-1px);
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5em;
            }

            .button-container {
                gap: 15px;
            }

            button {
                padding: 10px 20px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="background"></div>

    <!-- Twinkling Stars -->
    <div id="starfield"></div>

    <!-- Main Content -->
    <div class="container">
        <h1>Portfolio</h1>
        <p class="subtitle">Welcome to my creative space</p>
        
        <div class="button-container">
            <button onclick="navigate('projects')">Projects</button>
            <button onclick="navigate('about')">About</button>
            <button onclick="navigate('contact')">Contact</button>
            <button onclick="navigate('blog')">Blog</button>
        </div>
    </div>

    <script>
        // Generate twinkling stars background
        function generateStars() {
            const starfield = document.getElementById('starfield');
            const starCount = 50;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'stars';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                starfield.appendChild(star);
            }
        }

        // Navigation function
        function navigate(section) {
            console.log('Navigating to: ' + section);
            // Add your navigation logic here
            // For now, you can replace this with actual page navigation
            alert('Navigate to ' + section + ' page');
        }

        // Initialize stars on load
        window.addEventListener('load', generateStars);
    </script>
</body>
</html>
