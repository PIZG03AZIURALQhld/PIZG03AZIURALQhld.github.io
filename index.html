<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #f8f8f8;
            color: #333;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        h1 {
            font-size: 64px;
            margin-bottom: 80px;
            letter-spacing: 3px;
            color: #222;
            font-weight: 300;
            text-transform: uppercase;
        }

        .carousel {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
        }

        .carousel-button {
            padding: 16px 40px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            background: rgba(255, 255, 255, 0.8);
            color: #333;
            border: 2px solid #333;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            backdrop-filter: blur(10px);
        }

        .carousel-button:hover {
            background: #333;
            color: #f8f8f8;
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .carousel-button a {
            text-decoration: none;
            color: inherit;
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="parallaxCanvas"></canvas>

    <div class="container">
        <h1>Portfolio</h1>
        <div class="carousel">
            <button class="carousel-button">
                <a href="#projects">Projects</a>
            </button>
            <button class="carousel-button">
                <a href="#about">About</a>
            </button>
            <button class="carousel-button">
                <a href="#contact">Contact</a>
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('parallaxCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Tile settings
        const tiles = [];
        const tileSize = 80;
        const numTiles = 150;
        let time = 0;

        // Initialize floating tiles at different depths
        function initTiles() {
            tiles.length = 0;
            for (let i = 0; i < numTiles; i++) {
                tiles.push({
                    x: Math.random() * canvas.width * 1.5 - canvas.width * 0.25,
                    y: Math.random() * canvas.height * 1.5 - canvas.height * 0.25,
                    z: Math.random(), // depth (0 = far, 1 = close)
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3,
                    wobbleX: Math.random() * Math.PI * 2,
                    wobbleY: Math.random() * Math.PI * 2,
                    wobbleSpeedX: 0.002 + Math.random() * 0.003,
                    wobbleSpeedY: 0.002 + Math.random() * 0.003
                });
            }
        }

        function drawTiles() {
            // Sort tiles by depth (far to near)
            tiles.sort((a, b) => a.z - b.z);

            tiles.forEach(tile => {
                // Update wobble
                tile.wobbleX += tile.wobbleSpeedX;
                tile.wobbleY += tile.wobbleSpeedY;

                // Update position with slow drift
                tile.x += tile.vx;
                tile.y += tile.vy;

                // Apply wobble effect
                const wobbleOffsetX = Math.sin(tile.wobbleX) * 3;
                const wobbleOffsetY = Math.cos(tile.wobbleY) * 3;

                const displayX = tile.x + wobbleOffsetX;
                const displayY = tile.y + wobbleOffsetY;

                // Wrap around screen edges
                if (displayX > canvas.width) tiles[tiles.indexOf(tile)].x = -tileSize;
                if (displayX < -tileSize) tiles[tiles.indexOf(tile)].x = canvas.width;
                if (displayY > canvas.height) tiles[tiles.indexOf(tile)].y = -tileSize;
                if (displayY < -tileSize) tiles[tiles.indexOf(tile)].y = canvas.height;

                // Calculate size and opacity based on depth
                const scale = 0.3 + tile.z * 0.7; // Closer tiles are larger
                const size = tileSize * scale;
                const opacity = 0.05 + tile.z * 0.15;

                // Color variation based on depth
                const grayValue = Math.floor(180 + tile.z * 40);
                const color = `rgba(${grayValue}, ${grayValue}, ${grayValue}, ${opacity})`;

                // Draw tile
                ctx.fillStyle = color;
                ctx.fillRect(displayX, displayY, size, size);

                // Draw border
                ctx.strokeStyle = `rgba(100, 100, 100, ${opacity * 0.6})`;
                ctx.lineWidth = 1;
                ctx.strokeRect(displayX, displayY, size, size);
            });
        }

        function animate() {
            // Clear canvas with subtle background
            ctx.fillStyle = '#f8f8f8';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw subtle gradient overlay
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0.02)');
            gradient.addColorStop(1, 'rgba(200, 200, 200, 0.02)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawTiles();
            time += 0.016; // ~60fps

            requestAnimationFrame(animate);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Initialize and start animation
        initTiles();
        animate();
    </script>
</body>
</html>
